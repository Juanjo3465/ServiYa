name: CI

# Gate de integración (T6.22 / contract tests M24): corre `mvn test` en cada módulo backend en cada push y
# PR. Los contract tests de Spring Cloud Contract (JwksTest, AuthTest en el monolito) y los tests de rechazo
# de token por servicio se ejecutan como parte de `mvn test`, así que romper un contrato FALLA el build.
# El gate productor↔consumidor completo (stub-runner, T6.20) corre en el job `contract-stub-runner`: instala
# el stub del monolito y verifica que el gateway consume el contrato del JWKS tal como lo publica el emisor.

on:
  push:
    branches: [main, api-gateway]
  pull_request:
    branches: [main, api-gateway]

# Cancela ejecuciones viejas del mismo ref si llega una nueva.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: backend test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend/serviya
          - backend/api-gateway
          - backend/notifications-service
          - backend/chat-service
          - backend/identity-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn test (incluye contract tests SCC)
        working-directory: ${{ matrix.module }}
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress test

  contract-stub-runner:
    name: contract stub-runner (productor↔consumidor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Publica el stub jar del PRODUCTOR (emisor del JWKS) en el repo Maven local del runner.
      - name: install stub del productor (monolito)
        working-directory: backend/serviya
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress install -DskipTests

      # Corre SOLO los tests @Tag("stubrunner") del CONSUMIDOR (gateway) contra ese stub.
      - name: gateway contract (stub-runner)
        working-directory: backend/api-gateway
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress test -DexcludedGroups= -Dgroups=stubrunner

  frontend-build:
    name: frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/serviya/package-lock.json

      - name: install deps
        working-directory: frontend/serviya
        run: npm ci

      # Lint BLOQUEANTE (M46 cerrado, 2026-11-23): los errores de lint del frontend están en 0 tras migrar
      # el data-fetching a TanStack Query y cerrar los set-state-in-effect. eslint falla el gate ante
      # cualquier ERROR nuevo; las ~5 warnings exhaustive-deps restantes siguen siendo advisory (eslint no
      # falla por warnings por defecto) y se limpiarán aparte (ESTADO M45/M46).
      - name: lint (gate)
        working-directory: frontend/serviya
        run: npm run lint

      - name: build (gate)
        working-directory: frontend/serviya
        run: npm run build
