# Configuración de Prometheus (T6.23). Scrapea los endpoints /actuator/prometheus de los servicios Java
# por su PUERTO DE GESTIÓN interno (9090, NO publicado al host) desde dentro de la red de docker-compose, y
# carga las reglas de alerta de observability/prometheus-alerts.yml (Fase 6).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: monolith
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9090']
        labels: { service: monolith }

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:9090']
        labels: { service: gateway }

  - job_name: notifications-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notifications-service:9090']
        labels: { service: notifications-service }

  # El chat-service entra como target cuando exponga /actuator|/metrics de Prometheus (ESTADO M41(a)).
  # - job_name: chat-service
  #   metrics_path: /actuator/prometheus
  #   static_configs:
