# Lab 04 - Security (Secure Channel).
#
# :80 solo redirige: así el intento de usar HTTP plano es rechazado de forma
# observable (301 -> https://<host>:8443), que es la mitad "denied" del
# escenario de calidad.
server {
    listen 80;
    server_name _;

    return 301 https://$host:8443$request_uri;
}

# Borde TLS: aquí termina el canal seguro (navegador <-> nginx). El tramo
# nginx -> gateway sigue siendo HTTP dentro de la red de Docker (zona de
# confianza de un solo host); ver Limitaciones en el README.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado autofirmado SOLO para entorno local de pruebas, generado al
    # arrancar el contenedor por 40-dev-tls.sh (nunca se versiona la clave).
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS deliberadamente corto (5 min): no fijamos localhost ni una IP de LAN
    # durante un año en el navegador del desarrollador.
    add_header Strict-Transport-Security "max-age=300" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket del chat: nginx no reenvía el upgrade por defecto. Va antes que /api/ (prefijo más largo gana).
    # Timeout de inactividad > latido del chat (25 s) para no cortar conexiones sanas.
    location /api/chat/v1/ws {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location /uploads/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
