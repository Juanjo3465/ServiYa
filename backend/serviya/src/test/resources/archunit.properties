# ArchUnit configuration.
#
# The frozen baseline lives in src/test/resources/archunit_store. It records the
# cross-module dependencies that already exist so that the initial adoption of the
# architecture rules does not require a big-bang refactor.
#
# To intentionally update the baseline after removing or accepting violations, run:
#   ./mvnw test -Darchunit.freeze.store.default.allowStoreUpdate=true
#
# To recreate the baseline from scratch (only when consciously accepting the current state):
#   ./mvnw test \
#     -Darchunit.freeze.store.default.allowStoreCreation=true \
#     -Darchunit.freeze.store.default.allowStoreUpdate=true
#
# With allowStoreUpdate=false, fixing a frozen violation also requires updating the baseline:
# the store must be told that the violation no longer exists.
#
# CI must never create a new store or update the existing one; otherwise a
# misconfigured path could silently hide new violations.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
