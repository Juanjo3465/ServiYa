spring:
  application:
    name: serviya
  # Redis: usamos RedisTemplate directo (no repos Redis) y un health por PING (RedisCoordConfig), porque
  # el usuario de servicio tiene mínimo privilegio (sin INFO). Se excluyen los autoconfigs que asumen lo
  # contrario: el escaneo de repos Redis (trata repos JPA como Redis) y los health indicators por INFO.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 20

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

server:
  error:
    include-stacktrace: always
    include-message: always
  # El contenedor resuelve la IP real del cliente desde X-Forwarded-For/Forwarded PERO solo cuando el
  # salto inmediato es un proxy de confianza (rate limit por IP, D-09). Asi request.getRemoteAddr() no es
  # falsificable con el backend expuesto directo. En prod: declarar los proxies con server.tomcat.remoteip.*
  # si el balanceador no esta en un rango privado.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  # Redis (contrato §3.3 de documents/redis/). Dos nodos por propósito (ADR-001). Vía B: solo 'coord'
  # se cablea como bean (RedisCoordConfig); 'cache' queda como contrato para la Fase 6.
  redis:
    coord:
      mode: ${REDIS_COORD_MODE:standalone}        # standalone | sentinel | cluster (solo standalone, Fase 1)
      host: ${REDIS_COORD_HOST:localhost}
      port: ${REDIS_COORD_PORT:6379}
      nodes: ${REDIS_COORD_NODES:}
      sentinel-master: ${REDIS_COORD_SENTINEL_MASTER:}
      username: ${REDIS_COORD_USER:}
      password: ${REDIS_COORD_PASSWORD:}
      ssl: ${REDIS_COORD_SSL:false}
      timeout: ${REDIS_COORD_TIMEOUT:2s}
      connect-timeout: ${REDIS_COORD_CONNECT_TIMEOUT:2s}
    cache:
      mode: ${REDIS_CACHE_MODE:standalone}
      host: ${REDIS_CACHE_HOST:localhost}
      port: ${REDIS_CACHE_PORT:6379}
      nodes: ${REDIS_CACHE_NODES:}
      sentinel-master: ${REDIS_CACHE_SENTINEL_MASTER:}
      username: ${REDIS_CACHE_USER:}
      password: ${REDIS_CACHE_PASSWORD:}
      ssl: ${REDIS_CACHE_SSL:false}
      timeout: ${REDIS_CACHE_TIMEOUT:1s}
      connect-timeout: ${REDIS_CACHE_CONNECT_TIMEOUT:2s}
  # Rate limiting distribuido (deuda #6 / M13). Políticas en config (no en código) para ajustarlas sin
  # recompilar. algorithm: TOKEN_BUCKET (techo global, admite ráfaga) | SLIDING_WINDOW (exacto, sin
  # ráfaga de borde, para auth/costosos). failure-mode: OPEN (deja pasar si Redis cae) | CLOSED (rechaza).
  # Sujeto estandarizado (D-09): ip (anónimo), user (autenticado), email (solo ataque dirigido a cuenta).
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    policies:
      # --- Nivel 1: techo global de la API (api-default), por user/ip. OPEN: no tumbar la API si Redis cae.
      api-default:       { algorithm: TOKEN_BUCKET, capacity: 200, refill-per-second: 5, failure-mode: OPEN }
      # --- Nivel 2 (auth públicos): login OPEN (disponibilidad del acceso); registro/reset CLOSED (abuso/Brevo).
      login-ip:          { algorithm: SLIDING_WINDOW, capacity: 10, window: 15m, failure-mode: OPEN }
      register-ip:       { algorithm: SLIDING_WINDOW, capacity: 5, window: 60m, failure-mode: CLOSED }
      reset-ip:          { algorithm: SLIDING_WINDOW, capacity: 5, window: 15m, failure-mode: CLOSED }
      reset-email:       { algorithm: SLIDING_WINDOW, capacity: 3, window: 60m, failure-mode: CLOSED }
      reset-validate-ip: { algorithm: SLIDING_WINDOW, capacity: 20, window: 15m, failure-mode: CLOSED }
      reset-confirm-ip:  { algorithm: SLIDING_WINDOW, capacity: 10, window: 15m, failure-mode: CLOSED }
      # --- Nivel 2 (autenticados que NOTIFICAN por correo): OPEN + modo degradado de notificaciones (D-07/1a).
      request-write:     { algorithm: SLIDING_WINDOW, capacity: 30, window: 10m, failure-mode: OPEN }
      proposal-write:    { algorithm: SLIDING_WINDOW, capacity: 20, window: 15m, failure-mode: OPEN }
      report-create:     { algorithm: SLIDING_WINDOW, capacity: 10, window: 60m, failure-mode: OPEN }
      # --- Nivel 2 (autenticados costosos: subida de ficheros / geocoding externo). CLOSED.
      service-write:     { algorithm: SLIDING_WINDOW, capacity: 20, window: 60m, failure-mode: CLOSED }
      profile-photo:     { algorithm: SLIDING_WINDOW, capacity: 10, window: 60m, failure-mode: CLOSED }
      address-verify:    { algorithm: SLIDING_WINDOW, capacity: 20, window: 60m, failure-mode: CLOSED }
      account-security:  { algorithm: SLIDING_WINDOW, capacity: 5, window: 15m, failure-mode: CLOSED }
      # --- Nivel 2 (lecturas públicas pesadas), por ip. OPEN.
      search:            { algorithm: SLIDING_WINDOW, capacity: 60, window: 1m, failure-mode: OPEN }
      stats:             { algorithm: SLIDING_WINDOW, capacity: 30, window: 1m, failure-mode: OPEN }

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      # Grupo dedicado para verificar el estado de Redis sin exponer el resto de componentes.
      # show-details: when_authorized (NO 'always'): un llamante no autenticado solo ve {"status":"UP"}
      # —suficiente para verificar la conexión—, sin filtrar detalles (p. ej. versión de Redis) por el
      # 8080 público. El Actuator no está tras Spring Security, así que 'authorized' = nadie → sin fuga.
      group:
        redis:
          include: redis
          show-details: when_authorized

# Filtro de palabras (RNF-006): se censuran en todo texto libre antes de persistir
# (descripcion de perfil, motivo de reportes, resenas). Ampliar la lista NO requiere recompilar.
serviya:
  word-filter:
    blocked-words: >-
      idiota,imbecil,estupido,estupida,maldito,maldita,mierda,puta,puto,
      cabron,gilipollas,pendejo,pendeja,marica,huevon,malparido,gonorrea,
      hijueputa,verga,coño,joder,zorra,perra
  # Envío de correo (canal EMAIL). enabled=false por defecto: sin bean de EmailPort, la entrega EMAIL
  # degrada a FAILED sin romper nada. El api-key es SECRETO -> solo por variable de entorno EMAIL_API_KEY.
  email:
    enabled: ${EMAIL_ENABLED:false}
    provider-url: ${EMAIL_API_URL:https://api.brevo.com/v3/smtp/email}
    api-key: ${EMAIL_API_KEY:}
    from-email: ${EMAIL_FROM:no-reply@serviya.com}
    from-name: ${EMAIL_FROM_NAME:ServiYa}
    connect-timeout-ms: ${EMAIL_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${EMAIL_READ_TIMEOUT_MS:5000}
  # Por entorno: dev http://localhost:5173/reset-password | docker http://localhost:8081/reset-password
  frontend:
    reset-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
  password-reset:
    # Ventana de validez del enlace. Corta a proposito: es una credencial que viaja por correo.
    token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    cron:
      # Limpieza de tokens caducados. Mantenimiento sin urgencia (la validacion ya los rechaza
      # aunque sigan en la tabla), por eso a diario de madrugada.
      cleanup-expired: ${PASSWORD_RESET_CLEANUP_CRON:0 30 3 * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    use-root-path: true
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: false
  packages-to-scan: com.parosurvivors.serviya