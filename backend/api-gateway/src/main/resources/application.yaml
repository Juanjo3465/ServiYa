spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # ORDEN = prioridad: las rutas de servicios extraídos van ANTES del comodín del monolito.
          routes:
            # --- notifications-service (extraído, ESTADO §7.4 paso 1) ---
            - id: notifications-service
              uri: ${NOTIFICATIONS_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/notifications,/api/v1/notifications/**,/api/v1/notification-channels
            # --- monolito (todo lo que aún no se ha extraído) ---
            - id: monolith
              uri: ${MONOLITH_URI:http://localhost:8079}
              predicates:
                - Path=/**
          default-filters:
            # El gateway es la ÚNICA autoridad CORS: no reenvía Origin, así los servicios de detrás no aplican
            # su propia política (el monolito rechazaría con 403 un origen que solo se añadió aquí) ni duplican
            # las cabeceras Access-Control-* en la respuesta.
            - RemoveRequestHeader=Origin
          # CORS centralizado en el borde (T3.8): el gateway es la ÚNICA autoridad CORS; los servicios de
          # detrás no aplican la suya (en la Fase 4 se les quita). Allowlist por entorno vía
          # GATEWAY_CORS_ALLOWED_ORIGINS (default = orígenes de desarrollo). En prod se fija al dominio real
          # https (P3.6, placeholder por ahora: https://TODO-prod-domain). NUNCA "*": con allow-credentials
          # true (necesario para la cookie de refresh) el navegador exige eco de un origen concreto.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
  # redis-coord: SOLO para leer min_iat (Fase 3, T3.5). Timeout corto (hot-path); conexión perezosa de
  # Lettuce ⇒ el gateway arranca aunque redis-coord no esté. En prod, credenciales del usuario ACL
  # svc-gateway-coord por SPRING_DATA_REDIS_USERNAME/PASSWORD.
  data:
    redis:
      host: ${REDIS_COORD_HOST:localhost}
      port: ${REDIS_COORD_PORT:6379}
      timeout: ${REDIS_COORD_TIMEOUT:250ms}

server:
  port: ${SERVER_PORT:8080}

# Validación del access token ES256 (Fase 3). El JWKS se lee del emisor por la red interna (no público).
# Carga perezosa de claves ⇒ el gateway arranca aunque el JWKS no esté disponible todavía (T3.12).
serviya:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8079/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:https://auth.serviya.local}
      audience: ${JWT_AUDIENCE:marketplace-api}
      clock-skew: ${JWT_CLOCK_SKEW:60s}
  # Techo global api-default (T3.9): mismo token bucket que el monolito (capacidad/ráfaga, 5/s sostenido),
  # modo OPEN (no tumba la API si redis-coord cae). Las cuotas por endpoint se quedan en los servicios.
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    api-default:
      capacity: ${RATE_LIMIT_API_DEFAULT_CAPACITY:200}
      refill-per-second: ${RATE_LIMIT_API_DEFAULT_REFILL:5}

management:
  endpoints:
    web:
      # Se sirve en /gateway-actuator para no chocar con rutas reenviadas. Solo health.
      base-path: /gateway-actuator
      exposure:
        include: health
